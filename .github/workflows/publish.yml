name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'server-gtm-sandboxed-apis.d.ts'
      - 'web-gtm-sandboxed-apis.d.ts'

permissions:
  contents: read
  # npm trusted publishing: npm exchanges the job's OIDC token for a
  # short-lived publish credential, so no NPM_TOKEN is stored anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm publish --access public